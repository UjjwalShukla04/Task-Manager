services:
  db:
    image: postgres:16-alpine
    container_name: taskflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: taskflow
      POSTGRES_PASSWORD: taskflow
      POSTGRES_DB: taskflow
    # Host port 5433 to avoid clashing with a native Postgres on 5432.
    ports:
      - "5433:5432"
    volumes:
      - taskflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskflow -d taskflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Full-stack run: `docker compose --profile full up --build`
  api:
    profiles: ["full"]
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://taskflow:taskflow@db:5432/taskflow?schema=public
      JWT_SECRET: change-me-to-a-long-random-string-at-least-32-chars
      CLIENT_URL: http://localhost:8080
    ports:
      - "5000:5000"

  web:
    profiles: ["full"]
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000/api
        VITE_SOCKET_URL: http://localhost:5000
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  taskflow-db-data:
